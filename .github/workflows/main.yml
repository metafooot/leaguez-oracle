name: Update Matches from 【entity-ESPN¦canonical_name=ESPN】
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python fetch_espn.py
      - run: |
          echo "--- matches.json preview ---"
          head -c 2000 matches.json
          echo ""
          git config user.name "leaguezz-oracle"
          git config user.email "oracle@leaguezz.app"
          git add matches.json
          git diff --cached --quiet && echo "NO CHANGES" || (git commit -m "Update matches from 【entity-ESPN¦canonical_name=ESPN】" && git push)
